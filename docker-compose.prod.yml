version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: badminton-backend-prod
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=${SECRET_KEY:-change-this-in-production}
      - GOOGLE_CREDENTIALS_PATH=/app/credentials.json
      - GOOGLE_SHEET_ID=${GOOGLE_SHEET_ID}
      - CORS_ORIGINS=http://localhost:3000,http://frontend:3000
      - PORT=5000
    volumes:
      - ./backend/credentials.json:/app/credentials.json:ro
    working_dir: /app
    command: gunicorn --bind 0.0.0.0:5000 --workers 4 --timeout 120 app:create_app()
    networks:
      - badminton-network
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: badminton-frontend-prod
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:5000/api
    depends_on:
      - backend
    networks:
      - badminton-network
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  badminton-network:
    driver: bridge
