version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: badminton-app
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=${SECRET_KEY:-change-this-in-production}
      - GOOGLE_CREDENTIALS_PATH=/app/credentials.json
      - GOOGLE_SHEET_ID=${GOOGLE_SHEET_ID}
      - CORS_ORIGINS=http://localhost:5000,http://localhost
      - PORT=5000
    volumes:
      - ./backend/credentials.json:/app/credentials.json:ro
    working_dir: /app
    command: gunicorn --bind 0.0.0.0:5000 --workers 4 --timeout 120 app:create_app()
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
